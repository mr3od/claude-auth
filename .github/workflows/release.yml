name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: vendor/bin/pest

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build PHAR
        run: php claude-auth app:build claude-auth.phar --build-version=${{ steps.version.outputs.version }}

      - name: Install PHPacker
        run: composer global require phpacker/phpacker --no-interaction

      - name: Build standalone binaries
        run: |
          set -e
          PHPACKER="$(composer global config bin-dir --absolute)/phpacker"
          "$PHPACKER" build --src=./builds/claude-auth.phar --php=8.3 --no-interaction mac x64
          "$PHPACKER" build --src=./builds/claude-auth.phar --php=8.3 --no-interaction mac arm
          "$PHPACKER" build --src=./builds/claude-auth.phar --php=8.3 --no-interaction linux x64
          "$PHPACKER" build --src=./builds/claude-auth.phar --php=8.3 --no-interaction linux arm
          "$PHPACKER" build --src=./builds/claude-auth.phar --php=8.3 --no-interaction windows x64

      - name: Rename binaries for release
        run: |
          set -e
          mkdir -p dist
          cp builds/build/mac/mac-x64 dist/claude-auth-macos-x64
          cp builds/build/mac/mac-arm dist/claude-auth-macos-arm64
          cp builds/build/linux/linux-x64 dist/claude-auth-linux-x64
          cp builds/build/linux/linux-arm dist/claude-auth-linux-arm64
          cp builds/build/windows/windows-x64.exe dist/claude-auth-windows-x64.exe
          cp builds/claude-auth.phar dist/claude-auth.phar
          chmod +x dist/claude-auth-macos-x64 dist/claude-auth-macos-arm64 dist/claude-auth-linux-x64 dist/claude-auth-linux-arm64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
